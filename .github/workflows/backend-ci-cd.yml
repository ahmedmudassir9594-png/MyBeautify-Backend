name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean compile -DskipTests
        working-directory: artifacts/api-server/spring-app

  deploy:
    name: Deploy to E2E Networks VPS
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "Navigating to project directory..."
            cd /var/www/malkaz/MyBeautify-Backend

            echo "Pulling latest code from GitHub..."
            git reset --hard
            git pull origin main

            echo "Packaging Spring Boot application..."
            cd artifacts/api-server/spring-app
            mvn clean package -DskipTests

            echo "Restarting Malkaz backend service..."
            systemctl restart malkaz.service

            sleep 4
            systemctl is-active --quiet malkaz.service && echo "Deployment Successful: Service is Active!" || (echo "Service failed to restart!" && exit 1)