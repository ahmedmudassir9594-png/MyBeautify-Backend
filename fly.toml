# fly.toml app configuration file generated for malkaz
app = 'malkaz'
primary_region = 'iad'

[build]

[env]
  PORT = "8080"
  SERVER_PORT = "8080"
  SERVER_ADDRESS = "0.0.0.0"
  DDL_AUTO = "none"
  SPRING_JPA_HIBERNATE_DDL_AUTO = "none"
  SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  interval = '15s'
  timeout = '5s'
  grace_period = '45s'
  method = 'get'
  path = '/api/swagger-ui.html'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
