app = 'malkaz'
primary_region = 'iad'

[build]

[env]
  PORT = "8080"
  SERVER_PORT = "8080"
  SERVER_ADDRESS = "0.0.0.0"
  DDL_AUTO = "none"
  SPRING_JPA_HIBERNATE_DDL_AUTO = "none"
  SPRING_JPA_PROPERTIES_HIBERNATE_BOOT_ALLOW_JDBC_METADATA_ACCESS = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "180s"
    interval = "20s"
    method = "GET"
    timeout = "10s"
    path = "/api/products"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
