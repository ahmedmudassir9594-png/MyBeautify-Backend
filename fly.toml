# fly.toml app configuration file generated for malkaz
app = 'malkaz'
primary_region = 'iad'

[build]

[env]
  SPRING_JPA_DATABASE_PLATFORM = "org.hibernate.dialect.MySQLDialect"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT = "org.hibernate.dialect.MySQLDialect"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "120s"
    interval = "15s"
    timeout = "10s"
    method = "GET"
    path = "/api"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
