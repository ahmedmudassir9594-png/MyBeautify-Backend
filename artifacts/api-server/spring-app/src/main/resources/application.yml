app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_MINUTES:1440}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://malkaz.vercel.app,https://fashionmalkaz.com,https://www.fashionmalkaz.com,http://localhost:5173,http://localhost:3000}
  checkout:
    tax-rate: ${CHECKOUT_TAX_RATE:0.18}
    shipping-flat-rate: ${CHECKOUT_SHIPPING:79.00}
  mail:
    enabled: ${MAIL_ENABLED:true}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
    max-file-size-bytes: ${MAX_FILE_SIZE:5242880}
    base-url: ${STORAGE_BASE_URL:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    currency: ${RAZORPAY_CURRENCY:INR}
    company-name: ${RAZORPAY_COMPANY_NAME:MALKAZ Luxury Jewellery}
    theme-color: ${RAZORPAY_THEME_COLOR:#0A3B2C}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: never

google:
  client-id: "406643680175-rsvath699gbutrptvm32ju56sf3mopb3.apps.googleusercontent.com"

spring:
  application:
    name: malkaz-backend
  profiles:
    active: ${SPRING_PROFILE:default}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/Beautify?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Initial TiDB Schema"
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        temp:
          use_jdbc_metadata_defaults: false
        jdbc:
          time_zone: UTC

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: ${SWAGGER_ENABLED:false}
    try-it-out-enabled: false